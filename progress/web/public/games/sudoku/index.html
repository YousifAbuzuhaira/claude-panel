<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku</title>
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/look.css?group=games">
<link rel="stylesheet" href="../games.css">
<script src="/shared/theme.js"></script>
<style>
  /* The board's lines and marks: tints of the text and the accent, so they follow the scheme
     (and the blue of a note, the scheme's blue). The lines and a lost heart are solid, the text
     mixed toward the background without its see-through (--bg-solid, from legible.js), so the
     grid stays as plain as the digits over whatever shows through a see-through window. */
  :root {
    --thin: color-mix(in srgb, var(--ink) 15%, var(--bg-solid, transparent));
    --box: color-mix(in srgb, var(--ink) 45%, var(--bg-solid, transparent));
    --lost: color-mix(in srgb, var(--ink) 20%, var(--bg-solid, transparent));
    --pick: color-mix(in srgb, var(--accent) 30%, transparent);
    --pick-note: color-mix(in srgb, var(--blue) 36%, transparent);
    --peer: color-mix(in srgb, var(--ink) 7%, transparent);
    --same: color-mix(in srgb, var(--accent) 15%, transparent);
    /* As wide and as tall as the 9x9 board (9 x 50 px and its 2 px frame), whatever size is on,
       so nothing in the window moves when the size changes: the board sits centred in that
       square, and the status line, the pad and the controls stay where they are. */
    --column: 454px;
  }
  /* A narrow window: the column is the window's width, and game.js sizes the cells to fit it. */
  @media (max-width: 490px) { :root { --column: calc(100vw - 32px); } }
  .game { width: var(--column); user-select: none; }
  #hearts { font-size: 17px; letter-spacing: 1px; color: var(--red); cursor: default; }
  #hearts .lost { color: var(--lost); }
  hr { border: 0; height: 1px; background: var(--rule); margin: 8px 0 12px; }

  .board-host { height: var(--column); display: grid; place-items: center; }
  .board {
    display: grid; width: max-content; border: 2px solid var(--box);
    touch-action: none;
  }
  .cell {
    position: relative; width: var(--cell); height: var(--cell); cursor: pointer;
    border-left: 1px solid var(--thin); border-top: 1px solid var(--thin);
    display: flex; align-items: center; justify-content: center;
  }
  .cell.col0 { border-left: 0; }
  .cell.row0 { border-top: 0; }
  .cell.boxl { border-left: 2px solid var(--box); }
  .cell.boxt { border-top: 2px solid var(--box); }
  .cell.pick { background: var(--pick); }
  .cell.pick.as-note { background: var(--pick-note); }
  .cell.same { background: var(--same); }
  .cell.peer { background: var(--peer); }
  .value { font-size: var(--value); }
  .value.given { font-weight: bold; color: var(--ink); }
  .value.right { color: var(--green); }
  .value.wrong { color: var(--red); }
  .notes {
    position: absolute; inset: 1px 2px; display: grid;
    font-size: var(--note); color: var(--dim);
  }
  .notes span { place-self: center; padding: 0 3px; line-height: 1.25; border-radius: 3px; }
  .notes span.lit { color: var(--accent); font-weight: bold; background: var(--same); }

  /* One line, the column's width: a long message trims instead of widening the window. */
  #status {
    margin-top: 9px; min-height: 1.4em; text-align: center; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #status.green { color: var(--green); }
  #status.red { color: var(--red); }
  .pad { display: flex; justify-content: center; gap: 2px; margin-top: 8px; }
  .pad .key { font-size: 18px; }
  .pad .key.done { color: var(--faint); }
  .pad .key.erase { color: var(--dim); padding: 2px 7px; }
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-top: 10px; }
  .controls .chips { display: flex; gap: 4px; }
  .controls .sizes { justify-self: end; }
  .keys { margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<main class="game">
  <a class="back" href="../" title="All the games, and Learn">&larr; Games</a>
  <header class="head">
    <h1 class="ui-title" id="title">Sudoku</h1>
    <span id="hearts" title="Lives: a wrong answer costs one"></span>
  </header>
  <hr>
  <div class="board-host"><div class="board" id="board"></div></div>
  <div id="status"></div>
  <div class="pad" id="pad"></div>
  <div class="controls">
    <div class="chips modes">
      <button class="ui-chip" data-mode="answer" title="Answer mode (Space switches; hold Shift or Ctrl to note)">Answer</button>
      <button class="ui-chip" data-mode="notes" title="Notes mode (Space switches; hold Shift or Ctrl to answer)">Notes</button>
    </div>
    <button class="ui-btn" id="new" title="A fresh puzzle">New</button>
    <div class="chips sizes">
      <button class="ui-chip" data-size="4" title="Easy">4x4</button>
      <button class="ui-chip" data-size="6" title="Medium">6x6</button>
      <button class="ui-chip" data-size="9" title="Hard">9x9</button>
    </div>
  </div>
  <div class="keys hint">N notes &middot; Esc clear &middot; Ctrl+Z undo &middot; &#x232B; erase</div>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
