<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<link rel="stylesheet" href="../games.css">
<style>
  :root { --tile: 88px; --gap: 11px; --board: calc(4 * var(--tile) + 5 * var(--gap)); }
  .card { width: calc(var(--board) + 32px); user-select: none; }
  header { display: flex; align-items: center; gap: 6px; }
  header h1 { margin: 0 auto 0 0; font-size: 26px; color: var(--accent); }
  .score {
    position: relative; min-width: 72px; padding: 3px 10px 4px; border-radius: 5px;
    background: var(--slot); text-align: center;
  }
  .score small { display: block; font-size: 9px; color: var(--dim); letter-spacing: 0.05em; }
  .score b { font-size: 16px; }
  .rise {
    position: absolute; left: 0; right: 0; bottom: 2px; text-align: center;
    color: var(--accent); font-weight: bold; font-size: 14px; opacity: 0; pointer-events: none;
  }
  .rise.go { animation: rise 600ms linear; }
  @keyframes rise { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-28px); } }

  .board {
    position: relative; width: var(--board); height: var(--board); margin-top: 12px;
    background: var(--well); border-radius: 8px; overflow: hidden; touch-action: none;
  }
  .slot, .tile { position: absolute; left: 0; top: 0; width: var(--tile); height: var(--tile); }
  .slot { background: var(--slot); border-radius: 6px; }
  .tile.sliding { transition: transform 100ms ease-in-out; }
  .face {
    width: 100%; height: 100%; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-weight: bold;
  }
  .face.pop { animation: pop 150ms ease-out; }
  .face.grow { animation: grow 150ms ease-out; }
  @keyframes pop { from { transform: scale(1.2); } to { transform: scale(1); } }
  @keyframes grow { from { transform: scale(0); } to { transform: scale(1); } }

  .overlay {
    position: absolute; inset: 0; border-radius: 8px; background: rgba(28, 29, 32, 0.85);
    display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 34px; }
  .overlay .buttons { display: flex; gap: 10px; margin-top: 16px; }
  .overlay button {
    font: inherit; font-weight: bold; border: 0; border-radius: 5px; padding: 6px 13px 7px; cursor: pointer;
    background: #3a3b41; color: var(--ink);
  }
  .overlay button.keep { background: #f5c400; color: #26231c; }

  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  footer button.press { color: var(--ink); font-weight: bold; }
  @media (max-width: 460px) { :root { --tile: 66px; --gap: 9px; } }
</style>
</head>
<body>
<a class="back" href="../">&larr; games</a>
<main class="card">
  <header>
    <h1>2048</h1>
    <div class="score"><small>SCORE</small><b id="score">0</b><span class="rise" id="rise"></span></div>
    <div class="score"><small>BEST</small><b id="best">0</b></div>
  </header>
  <div class="board" id="board">
    <div id="slots"></div>
    <div id="tiles"></div>
    <div class="overlay" id="overlay">
      <h2 id="message"></h2>
      <div class="buttons">
        <button class="keep" id="keep">Keep going</button>
        <button id="again">Try again</button>
      </div>
    </div>
  </div>
  <footer>
    <span class="hint">Arrows, WASD or HJKL &middot; R restarts</span>
    <button class="press" id="new" title="Start over (R)">New game</button>
  </footer>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
