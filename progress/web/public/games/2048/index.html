<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/look.css?group=games">
<link rel="stylesheet" href="../games.css">
<script src="/shared/theme.js"></script>
<style>
  :root { --tile: 88px; --gap: 11px; --board: calc(4 * var(--tile) + 5 * var(--gap)); }
  .game { width: var(--board); user-select: none; }
  .rise { color: var(--accent); }

  .board {
    position: relative; width: var(--board); height: var(--board); margin-top: 12px;
    background: var(--well); border-radius: 8px; overflow: hidden; touch-action: none;
  }
  .slot, .tile { position: absolute; left: 0; top: 0; width: var(--tile); height: var(--tile); }
  .slot { background: var(--surface); border-radius: 6px; }
  .tile.sliding { transition: transform 100ms ease-in-out; }
  .face {
    width: 100%; height: 100%; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-weight: bold;
  }
  /* 2048 and past it glow in their own colour (--glow, set per tile); softer on a light card,
     where a wide glow smudges. */
  .face.glow { box-shadow: 0 0 18px color-mix(in srgb, var(--glow) 70%, transparent); }
  html[data-scheme='light'] .face.glow { box-shadow: 0 0 10px color-mix(in srgb, var(--glow) 35%, transparent); }
  /* The tiles are the game's own colours, but on a light scheme the 2 and the 4 are the quietest
     tiles, as on the original's light board: a solid step of the text toward the background,
     past the empty slot's, with the text on them (as widget/Game2048.ps1 has them). */
  :root { --tile-2: #4B4840; --tile-2-ink: #EDE6DA; --tile-4: #5E5644; --tile-4-ink: #F2E8D5; }
  html[data-scheme='light'] {
    --tile-2: color-mix(in srgb, var(--ink) 20%, var(--bg-solid, var(--card-fill)));
    --tile-4: color-mix(in srgb, var(--ink) 30%, var(--bg-solid, var(--card-fill)));
    --tile-2-ink: var(--ink); --tile-4-ink: var(--ink);
  }
  .face.pop { animation: pop 150ms ease-out; }
  .face.grow { animation: grow 150ms ease-out; }
  @keyframes pop { from { transform: scale(1.2); } to { transform: scale(1); } }
  @keyframes grow { from { transform: scale(0); } to { transform: scale(1); } }

  .overlay {
    position: absolute; inset: 0; border-radius: 8px; background: var(--veil);
    display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 30px; }
  .overlay .buttons { display: flex; gap: 10px; margin-top: 14px; }
  /* "Keep going" wears the scheme's gold, as "You win!" above it does, with the background's own
     colour for its text (the gold is light on a dark scheme and dark on a light one). */
  .overlay .ui-btn.keep { background: var(--gold); color: var(--bg-solid, var(--on-accent)); }

  footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; }
  footer .hint { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 460px) { :root { --tile: 66px; --gap: 9px; } }
</style>
</head>
<body>
<main class="game">
  <a class="back" href="../" title="All the games, and Learn">&larr; Games</a>
  <header class="head">
    <h1 class="ui-title">2048</h1>
    <div class="ui-stat"><span class="ui-caption">Score</span><b id="score">0</b><span class="rise" id="rise"></span></div>
    <div class="ui-stat"><span class="ui-caption">Best</span><b id="best">0</b></div>
  </header>
  <div class="board" id="board">
    <div id="slots"></div>
    <div id="tiles"></div>
    <div class="overlay" id="overlay">
      <h2 id="message"></h2>
      <div class="buttons">
        <button class="ui-btn primary keep" id="keep">Keep going</button>
        <button class="ui-btn" id="again">Try again</button>
      </div>
    </div>
  </div>
  <footer>
    <span class="hint">Arrows, WASD or HJKL &middot; R restarts</span>
    <button class="ui-btn" id="new" title="Start over (R)">New game</button>
  </footer>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
