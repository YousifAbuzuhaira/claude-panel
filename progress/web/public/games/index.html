<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games</title>
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/look.css?group=games">
<link rel="stylesheet" href="games.css">
<script src="/shared/theme.js"></script>
<style>
  .game { width: 480px; }
  .lede { margin: 2px 0 12px; color: var(--dim); }
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  /* A row's text sits on the title's left edge; its hover fill reaches past it. */
  .list a {
    display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: 16px;
    margin: 0 -10px; padding: 10px; border-radius: var(--radius);
    color: var(--ink); text-decoration: none;
  }
  .list a:hover { background: var(--hover); }
  .list a:active { background: var(--pressed); }
  .list a:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
  .list b { font-size: 15px; }
  .list span { color: var(--dim); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .also { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule); }
  .also b { color: var(--blue); font-weight: 700; }
</style>
</head>
<body>
<main class="game">
  <header class="head"><h1 class="ui-title">Games</h1></header>
  <p class="lede">Something to do while Claude works.</p>
  <ul class="list">
    <li><a class="game-link" href="sudoku/"><b>Sudoku</b><span>4&times;4, 6&times;6, 9&times;9</span></a></li>
    <li><a class="game-link" href="2048/"><b>2048</b><span>slide and merge</span></a></li>
    <li><a class="game-link" href="typing/"><b>Typing</b><span>ten words, how fast</span></a></li>
    <li><a class="game-link" href="chess/"><b>Chess</b><span>rated puzzles</span></a></li>
  </ul>
  <ul class="list also">
    <li><a id="learn" href="../learn/" title="Courses, and the colour scheme in Settings"><b>Learn &rarr;</b><span>courses from videos and docs</span></a></li>
  </ul>
</main>
<script type="module" src="index.js"></script>
</body>
</html>
