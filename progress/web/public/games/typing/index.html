<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing</title>
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/look.css?group=games">
<link rel="stylesheet" href="../games.css">
<script src="/shared/theme.js"></script>
<style>
  /* Monkeytype's colours. game.js sets them from the chosen theme; 'auto' (the default) is the
     colour scheme every window shares, so before it runs they are the scheme's. A Monkeytype
     theme repaints the shared roles too, so the whole window wears it. --untyped, the letters
     still to type, is sub; in 'auto' game.js makes it the scheme's dim at full opacity, so they
     stay apart from the typed ones however see-through the window is. */
  :root {
    --bg: var(--card-fill); --main: var(--accent); --caret: var(--accent); --sub: var(--dim); --subAlt: var(--surface);
    --text: var(--ink); --error: var(--red); --errorExtra: #884749; --untyped: var(--sub);
    --type: 'Roboto Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    --letter: 26px;
    /* The views share one height, so the window holds still between typing, result and themes. */
    --views: 290px;
  }
  body { font-family: var(--type); color: var(--text); }
  .game { width: 700px; }
  .settings { font-size: 12px; color: var(--main); white-space: nowrap; }
  .settings .lang { color: var(--sub); margin-left: 1.2em; }

  .views { display: grid; margin-top: 22px; min-height: var(--views); }
  .views > * { grid-area: 1 / 1; min-width: 0; }
  [hidden] { display: none !important; }
  .typing { align-self: center; }
  #progress { color: var(--main); font-size: 22px; margin-bottom: 6px; visibility: hidden; }
  .wordsHost { position: relative; }
  #words {
    display: flex; flex-wrap: wrap; font-size: var(--letter); line-height: 1.15; user-select: none;
    transition: filter 150ms;
  }
  .word { margin: 4px calc(var(--letter) * 0.6) 4px 0; border-bottom: 2px solid transparent; white-space: pre; }
  .word.left-wrong { border-bottom-color: var(--error); }
  .word span { color: var(--untyped); }
  .word span.right { color: var(--text); }
  .word span.wrong { color: var(--error); }
  .word span.extra { color: var(--errorExtra); }
  #caret {
    position: absolute; left: 0; top: 0; width: 2.5px; height: calc(var(--letter) * 1.15);
    border-radius: 1px; background: var(--caret); pointer-events: none;
  }
  #caret.glide { transition: left 90ms, top 90ms; }
  #caret.blink { animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  #veil {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: var(--text); cursor: pointer;
  }
  .unfocused #words { filter: blur(6px); }
  .unfocused #caret { visibility: hidden; }

  /* The result: wpm and acc in a column, the graph beside them taking what is left (game.js draws
     it at the width it gets, so it ends where the header does and its labels stay 10 px), the
     details across the foot. */
  .result { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 24px; align-content: start; }
  .stat .name { color: var(--sub); font-size: 15px; }
  .stat .value { color: var(--main); font-size: 30px; line-height: 1.1; }
  .big .name { font-size: 22px; }
  .big .value { font-size: 58px; line-height: 1; white-space: nowrap; }
  .big .stat + .stat { margin-top: 6px; }
  #crown { font-size: 22px; margin-left: 8px; vertical-align: 0.6em; }
  #graph { display: block; width: 100%; height: 196px; margin-top: 8px; overflow: visible; }
  #graph text { fill: var(--sub); font: 10px var(--type); }
  .details { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0 40px; margin-top: 18px; }
  .details .type .value { font-size: 16px; line-height: 1.3; }

  .picker { display: flex; flex-direction: column; min-height: 0; max-height: var(--views); }
  #search {
    flex: none; height: 30px; font: 15px var(--type); color: var(--text); background: var(--subAlt); caret-color: var(--caret);
    border: 0; border-radius: var(--radius); padding: 0 10px; outline: none;
  }
  #search::placeholder { color: var(--sub); }
  #search::selection { background: var(--main); color: var(--bg); }
  #swatches {
    flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px;
    margin-top: 10px; overflow-y: auto; padding: 2px 4px 2px 2px;
  }
  .swatch {
    height: 34px; border-radius: var(--radius); border: 2px solid transparent; cursor: pointer;
    display: flex; align-items: center; gap: 6px; padding: 0 8px 0 9px; font: 12px var(--type); min-width: 0;
  }
  .swatch.on { border-color: var(--text); }
  .swatch .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .swatch .note { flex: none; margin-right: 6px; }
  .swatch i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  /* 'auto' spans the first row and names the scheme it follows. It is the window's own look, so
     it wears the window's see-through surface and a hairline, not a solid patch. */
  .swatch.auto { grid-column: 1 / -1; background: var(--surface); outline: 1px solid var(--line); outline-offset: -1px; }
  .swatch.auto.on { outline: none; }
  .nothing { color: var(--sub); padding: 10px 2px; }

  footer { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-top: 26px; font-size: 12px; color: var(--sub); }
  footer .keys { grid-column: 2; white-space: nowrap; }
  kbd { background: var(--subAlt); color: var(--text); border-radius: 4px; padding: 1px 6px 2px; font: 12px var(--type); }
  kbd + .sep { margin-right: 18px; }
  #themeButton {
    justify-self: end; max-width: 100%; min-width: 0; background: none; border: 0; border-radius: var(--radius);
    padding: 2px 4px; margin-right: -4px; color: var(--sub); font: 12px var(--type);
    cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  #themeButton:hover { color: var(--text); background: var(--hover); }
  #themeButton i { width: 9px; height: 9px; border-radius: 50%; background: var(--main); flex: none; }
  #themeName { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<main class="game">
  <a class="back" href="../" title="All the games, and Learn">&larr; Games</a>
  <header class="head">
    <h1 class="ui-title">typetest</h1>
    <div class="settings">words 10<span class="lang">english</span></div>
  </header>
  <div class="views">
    <section class="typing" id="typing">
      <div id="progress">0/10</div>
      <div class="wordsHost" id="wordsHost">
        <div id="words"></div>
        <div id="caret"></div>
        <div id="veil" hidden>Click here to focus</div>
      </div>
    </section>
    <section class="result" id="result" hidden>
      <div class="big">
        <div class="stat"><div class="name">wpm</div><div class="value"><span id="wpm">-</span><span id="crown" title="new personal best" hidden>&#x265B;</span></div></div>
        <div class="stat"><div class="name">acc</div><div class="value" id="acc">-</div></div>
      </div>
      <svg id="graph" viewBox="0 -6 440 196" preserveAspectRatio="xMinYMin meet" aria-label="speed each second"></svg>
      <div class="details">
        <div class="stat type"><div class="name">test type</div><div class="value">words 10<br>english</div></div>
        <div class="stat"><div class="name">raw</div><div class="value" id="raw">-</div></div>
        <div class="stat" title="correct, incorrect, extra, and missed"><div class="name">characters</div><div class="value" id="chars">-</div></div>
        <div class="stat"><div class="name">consistency</div><div class="value" id="consistency">-</div></div>
        <div class="stat"><div class="name">time</div><div class="value" id="time">-</div></div>
      </div>
    </section>
    <section class="picker" id="picker" hidden>
      <input id="search" type="text" placeholder="search themes..." autocomplete="off" spellcheck="false">
      <div id="swatches"></div>
    </section>
  </div>
  <footer>
    <span class="keys"><kbd>tab</kbd><span class="sep"> - restart test</span><kbd>esc</kbd><span> - themes</span></span>
    <button id="themeButton" title="Themes (Esc)"><i></i><span id="themeName"></span></button>
  </footer>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
