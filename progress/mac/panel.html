<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Progress</title>
<!-- The roles every window shares (Ember until ClaudePanel.swift pushes the appearance), and the
     derivation that turns three colours into all of them. Classic files over file://: Swift grants
     read access to the plugin root, the parent of mac/. -->
<link rel="stylesheet" href="../web/public/shared/theme.css">
<script src="../web/public/shared/theme.js"></script>
<style>
  /* The floating panel on macOS: the twin of widget/PhasesWidget.ps1, drawn from phases.json
     (contract 1). ClaudePanel.swift calls render(state) on every change, setAppearance(a) when the
     colour scheme or see-through changes, setPresets(list), setReleases({...}) and setPrefs({...}) once.
     Row 1: the open/closed mark, the title, the version (the Releases tab) and the marks. Then the
     strip a mark opens, right under it; then the tabs with their counts; a rule; the tab; a footer.
     Sizes are the WPF panel's: padding 10 12, marks 22, glyph column 14, [x] column 28, gaps 2 / 8. */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { color: var(--ink); font: 12px/1.25 var(--mono); -webkit-user-select: none; user-select: none; cursor: default; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }

  /* The card: the window's only fill. --card-fill carries the panel's see-through; text, lines and
     accents stay solid. As tall as its content, or as the window when sized (then the body scrolls). */
  #card {
    position: relative; display: flex; flex-direction: column; max-height: 100vh; overflow: hidden;
    padding: 10px 12px; background: var(--card-fill); border: 1px solid var(--edge); border-radius: var(--card-radius);
  }
  #card.sized { height: 100vh; }
  #top { flex: none; display: flex; flex-direction: column; }
  #foot { flex: none; }
  #scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; margin: 0 -12px; padding: 0 12px; }
  #scroll::-webkit-scrollbar { width: 6px; }
  #scroll::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 3px; border: 0; }
  #body { display: flow-root; }

  /* Below 85% the terminal shows through the card, and over a backdrop of the other lightness even
     the text colour sinks into it: a soft halo of the card's own colour round every glyph and line
     keeps them off whatever is behind. As in every other window it comes in gently and is full by
     50% (set by wear()). The card's fill itself is never haloed, so the gaps between the lines
     stay see-through. Three stacked shadows: one alone is too faint to lift dim text off a
     backdrop of the other lightness. */
  .halo #top, .halo #scroll, .halo #foot {
    filter: drop-shadow(0 0 0.5px var(--halo)) drop-shadow(0 0 1px var(--halo)) drop-shadow(0 0 2px var(--halo));
  }

  /* Row 1: open/closed mark, title (the one-line summary when closed), the version, the marks. The
     open/closed mark's box overhangs the padding by as much as its small glyph leaves empty and
     ends on the glyph column, so the title starts where the second lines of runs do; the other
     marks reach 6px into the padding so their glyphs line up with the text edge. Swift drags the
     panel by what lies between them (it is told where they are: post 'chrome'). */
  #head { display: flex; align-items: center; height: 22px; }
  #head .ui-mark { flex: none; }
  #collapse { margin: 0 -1px 0 -7px; font-size: 9px; }
  #look { margin-left: 2px; }
  #games { margin-left: 2px; }
  #close { margin: 0 -6px 0 2px; }
  #title { flex: 1 1 auto; min-width: 0; display: flex; color: var(--dim); white-space: nowrap; }
  #title-main { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #title-tail { flex: none; white-space: pre; }
  #title b { font-weight: bold; }
  /* The version is the Releases tab: dim like a tab, the accent dot while there are notes not yet opened. */
  #releases-tab { flex: none; margin: 0 6px 0 8px; }

  /* Row 2: the tabs, with the whole row for their counts. Mono, so bold doesn't move them. */
  #tabs { display: flex; align-items: center; margin-top: 4px; min-width: 0; }
  #tablist { display: flex; gap: 12px; flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; }
  .tab { flex: none; padding: 2px 0; color: var(--dim); white-space: nowrap; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); font-weight: bold; }
  .new { color: var(--accent); font-weight: normal; }

  /* The strips under row 1: one at a time, right under the mark that opens it. */
  .strip { margin: 8px 0; }
  .strip[hidden] { display: none; }
  .ui-caption { display: block; }
  #look-strip .ui-caption { margin-bottom: 6px; }
  #look-strip .ui-caption.next { margin-top: 12px; }
  /* The swatches share the row: the last ends where the percentages below end. One row down to
     the narrowest panel (240): a swatch's two dots need 24px. */
  #swatches { display: grid; grid-template-columns: repeat(auto-fit, minmax(34px, 1fr)); gap: 6px; }
  #swatches .ui-swatch { width: auto; min-width: 0; }
  .bar-row { display: flex; align-items: center; height: 18px; }
  .bar-row + .bar-row { margin-top: 2px; }
  .bar-row label { flex: none; width: 52px; color: var(--dim); font-size: 11.5px; }
  .bar-row output { flex: none; width: 40px; text-align: right; color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .see { position: relative; flex: 1 1 auto; height: 18px; cursor: pointer; touch-action: none; }
  .see:hover .track { background: var(--edge); }
  .see .track, .see .fill { position: absolute; left: 0; top: 7px; height: 4px; border-radius: 2px; pointer-events: none; }
  .see .track { right: 0; background: var(--line); }
  .see .fill { background: var(--accent); }
  .see .knob { position: absolute; top: 4px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--ink); pointer-events: none; }
  .link { display: inline-block; color: var(--blue); cursor: pointer; }
  .link:hover { text-decoration: underline; }
  #custom { align-self: flex-start; margin-top: 6px; }
  #custom.in-use { font-weight: bold; }
  #look-strip { display: flex; flex-direction: column; }
  #look-strip[hidden], #games-strip[hidden] { display: none; }
  #games-strip { display: flex; flex-wrap: wrap; gap: 6px; }
  #games-strip .ui-chip { font-family: var(--mono); }
  #games-strip .ui-chip.first { margin-right: 6px; }

  .rule { flex: none; height: 1px; margin: 8px 0; background: var(--rule); }

  /* The body: a glyph column, then the text. */
  .row { display: flex; align-items: baseline; }
  .row + .row, .sub { margin-top: 2px; }
  .group, .row.group { margin-top: 8px; }
  .cell { flex: none; width: 14px; white-space: nowrap; }
  .box { flex: none; width: 28px; white-space: nowrap; }
  .text { flex: 1 1 auto; min-width: 0; }
  .trim { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .indent { margin-left: 14px; }
  .heading { font-weight: bold; margin-bottom: 6px; }
  .strong { font-weight: bold; }
  /* A bar and its counts on one line: a narrow panel cuts the bar's tail, never the counts. */
  .counts { display: flex; white-space: nowrap; min-width: 0; }
  .counts .bar { flex: 0 1 auto; overflow: hidden; }
  .counts .rest { flex: none; white-space: pre; }
  .ink { color: var(--ink); } .dim { color: var(--dim); } .faint { color: var(--faint); }
  .ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--gold); } .acc { color: var(--accent); }
  /* The hint is read, not glanced at: dim (faint is for labels). */
  .hint { margin-top: 2px; color: var(--dim); font-size: 11.5px; line-height: 1.3; }
  .act { margin-top: 6px; }
  .glance { cursor: pointer; }
  .glance .count { flex: none; margin-left: 8px; }

  /* A footer sits a little higher, clear of the grip in the corner below its first letters. */
  #foot { margin: 8px 0 2px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #foot:empty { display: none; }

  /* The resize grip, inside the card's bottom-left corner (the panel hangs from the terminal's
     top-right corner). Swift puts its own grip view exactly over this box. */
  #grip { position: absolute; left: 0; bottom: 0; width: 14px; height: 14px; pointer-events: none; }
  #grip span { position: absolute; left: 4px; bottom: 3px; font: 10px/10px var(--sans); color: var(--faint); }

  .collapsed #tabs, .collapsed .strip, .collapsed .rule, .collapsed #scroll, .collapsed #foot, .collapsed #grip,
  .collapsed #releases-tab, .collapsed #look, .collapsed #games { display: none; }
</style>
</head>
<body>
<div id="card">
  <div id="top">
    <header id="head">
      <button class="ui-mark" id="collapse" title="Collapse">&#x25BC;</button>
      <div id="title"><span id="title-main">Progress</span><span id="title-tail"></span></div>
      <button class="tab" id="releases-tab" title="Releases: what is new in each version"></button>
      <button class="ui-mark" id="look" title="Colour scheme and see-through">◐</button>
      <button class="ui-mark" id="games" title="Learn and games"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 7.5h9.6a4.8 4.8 0 0 1 4.5 6.4l-1 2.9a2.4 2.4 0 0 1-4.2.6L14.6 15H9.4l-1.5 2.4a2.4 2.4 0 0 1-4.2-.6l-1-2.9a4.8 4.8 0 0 1 4.5-6.4z"/><path d="M8.2 10.2v3.2M6.6 11.8h3.2"/><circle class="dot" cx="15.4" cy="11" r="0.9"/><circle class="dot" cx="17.4" cy="13" r="0.9"/></svg></button>
      <button class="ui-mark" id="close" title="Hide until something new">✕</button>
    </header>
    <section class="strip" id="look-strip" hidden>
      <span class="ui-caption" id="scheme-caption">Colour scheme</span>
      <div class="ui-swatches" id="swatches"></div>
      <span class="ui-caption next">See-through</span>
      <div id="bars"></div>
      <div class="link" id="custom" title="Your own background, accent and text colours, in Learn's settings">Custom colours →</div>
    </section>
    <section class="strip" id="games-strip" hidden></section>
    <nav id="tabs"><div id="tablist"></div></nav>
    <div class="rule"></div>
  </div>
  <main id="scroll"><div id="body"></div></main>
  <div id="foot"></div>
  <div id="grip" title="Drag to resize; double-click to fit"><span>◣</span></div>
</div>
<script>
const post = message => window.webkit?.messageHandlers?.panel?.postMessage(message);
const T = globalThis.ClaudeTheme;
// The open/closed mark: solid triangles, drawn small (U+FE0E keeps the right one from turning emoji).
const G = { check: '✓', cross: '✗', live: '●', middot: '·', arrow: '→', course: '≡', collapse: '▼', expand: '▶︎' };
// Learn and the games, as the panel's games mark lists them (widget/Chrome.ps1 $UI_SIBLINGS), and
// the games page that lists them all (the WPF panel's "Games in the browser").
const SIBLINGS = [['learn', 'Learn'], ['games/sudoku', 'Sudoku'], ['games/2048', '2048'], ['games/typing', 'Typing'], ['games/chess', 'Chess'], ['games', 'All games']];
const SEE_THROUGH = [['panel', 'Panel'], ['learn', 'Learn'], ['games', 'Games']];
const MIN_OPACITY = T ? T.MIN_OPACITY : 0.15;
const BAR_CELLS = 18;
// The footer says how many more there are; the card stays short.
const RELEASES_SHOWN = 2;
const PICKABLE_TABS = ['phases', 'tests', 'learn'];
// Which tab gives up its count first when the tabs don't fit: a live test count goes last.
const SHORTEN_ORDER = ['learn', 'phases', 'tests'];
// The halo round text and lines, as every window has it (UI_HALO_BELOW in widget/Chrome.ps1,
// shared/legible.js): on below the first see-through, at no less than the last strength, full by
// the second.
const HALO_BELOW = 0.85;
const HALO_FULL_AT = 0.5;
const HALO_LEAST = 0.25;
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

let state = null;
let tab = 'phases';
let manualTab = null;
let seenFocus = null;
let seenPlan = null;
// Once the first state is drawn the saved prefs are past (setPrefs comes before it).
let isSeeded = false;
// The pick Swift keeps for the next panel, as last posted (JSON): posted again only on a change.
let savedPick = '';
let collapsed = false;
let strip = '';
// The saved appearance, given before the first paint (ClaudePanel.swift injects it), else Ember.
let appearance = T ? T.parseAppearance(window.__appearance ?? null) : null;
let presets = T ? T.parsePresets(null) : [];
// A see-through bar being dragged: the appearance Swift pushes meanwhile waits until it's let go.
let dragging = null;
let pending = null;
let releases = { version: null, list: [] };
let seenRelease = null;
let seenBefore = null;
let hoveredPreset = '';
let lastHeight = 0;
let lastChrome = '';

const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) node.append(kid.nodeType ? kid : String(kid));
  return node;
};
const $ = id => document.getElementById(id);
const bar = (ratio, cells = BAR_CELLS) => {
  const full = ratio === null || ratio === undefined || !Number.isFinite(Number(ratio)) ? 0 : Math.max(0, Math.min(cells, Math.round(Number(ratio) * cells)));
  return '█'.repeat(full) + '░'.repeat(cells - full);
};
const hasPlan = () => !!(state?.plan && state.plan.items?.length > 0);
const runs = () => (state?.runs || []).filter(Boolean);
const build = () => state?.learn?.build || null;
const course = () => state?.learn?.course || null;

// -1, 0 or 1 by version number ("0.10.0" after "0.9.1").
function compareVersion(a, b) {
  const pa = String(a ?? '').split('.').map(n => parseInt(n, 10) || 0);
  const pb = String(b ?? '').split('.').map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const d = (pa[i] || 0) - (pb[i] || 0);
    if (d) return Math.sign(d);
  }
  return 0;
}
const formatDate = date => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(date ?? ''));
  return m ? `${Number(m[3])} ${MONTHS[Number(m[2]) - 1] || m[2]}` : String(date ?? '');
};
const newestRelease = () => releases.list[0]?.version || releases.version || null;
const isReleaseUnseen = () => {
  const newest = newestRelease();
  return !!newest && (!seenRelease || compareVersion(newest, seenRelease) > 0);
};

function runLook(run) {
  if (run.status === 'passed') return { glyph: G.check, color: 'ok' };
  if (run.status === 'failed') return { glyph: G.cross, color: 'bad' };
  return { glyph: G.live, color: Number(run.failed) > 0 ? 'bad' : 'acc' };
}
const buildColor = s => ({ failed: 'bad', 'waiting-picks': 'warn', done: 'ok' })[s] || 'acc';

// Each tab's label with its count, and without.
function labels() {
  const plan = hasPlan() ? state.plan : null;
  const list = runs();
  const live = list.filter(run => run.status === 'running');
  const full = { phases: 'Phases', tests: 'Tests', learn: 'Learn' };
  const short = { ...full };
  if (plan) full.phases = `Phases ${plan.done}/${plan.total}`;
  if (live.length) {
    full.tests = `Tests ${G.live} ${live.at(-1).count}`;
    short.tests = `Tests ${G.live}`;
  } else if (list.length) {
    full.tests = short.tests = `Tests ${runLook(list.at(-1)).glyph}`;
  }
  const b = build();
  if (b && b.state === 'running') {
    full.learn = short.learn = `Learn ${G.live}`;
    if (Number(b.total) > 0) full.learn = `Learn ${b.done}/${b.total}`;
  }
  return { full, short };
}

// The tab in front, as the WPF panel picks it: something new (a new test run, a new plan) brings its
// tab forward and ends the person's pick; otherwise the tab they clicked stays, and with no pick the
// panel shows what there is. The tab saved from last time comes with the plan and run that panel
// had seen (setPrefs), so the first state is weighed like any later one: a plain restart keeps the
// tab, a relaunch for a new plan or run brings that forward. Only Releases outlasts news, staying
// until another tab is clicked. Releases is only ever a click.
function pickTab() {
  const plan = hasPlan() ? state.plan : null;
  const planTitle = plan ? String(plan.title) : null;
  const list = runs();
  const live = list.filter(run => run.status === 'running');
  let isNewRun = false;
  let isNewPlan = false;
  const focus = state?.focus ?? null;
  if (focus && focus !== seenFocus) {
    if (seenFocus !== null || live.length > 0) isNewRun = true;
    seenFocus = focus;
  }
  if (planTitle && planTitle !== seenPlan && !isNewRun) isNewPlan = true;
  seenPlan = planTitle;
  if (manualTab !== 'releases' && (isNewRun || isNewPlan)) {
    tab = isNewRun ? 'tests' : 'phases';
    // The pick is over: the next panel no longer opens on it.
    if (manualTab) {
      post({ type: 'tab', value: null });
      savedPick = '';
    }
    manualTab = null;
  }
  if (state !== null && state !== undefined) isSeeded = true;
  if (manualTab) {
    tab = manualTab;
    // What the panel has seen since (a plan gone, a first run) goes with it.
    savePick();
    return;
  }
  if (tab === 'releases') tab = 'phases';
  if (!plan && list.length > 0 && tab !== 'learn') tab = 'tests';
  if (list.length === 0 && tab === 'tests') tab = plan || !build() ? 'phases' : 'learn';
  if (!plan && list.length === 0 && build()) tab = 'learn';
}

// --- The body of each tab -------------------------------------------------------------------

const markRow = (glyph, color, text, { cls = '', box = false, top = '' } = {}) =>
  el('div', { class: `row ${top}`.trim() }, el('span', { class: `${box ? 'box' : 'cell'} ${color}` }, glyph), el('div', { class: `text ${cls}`.trim() }, text));
// What a tab says when it has nothing: what it is for (in the text colour), and what fills it.
const empty = (headline, hint) => [el('div', { class: 'ink' }, headline), hint ? el('div', { class: 'hint' }, hint) : null];
const counts = (ratio, color, ...rest) => el('div', { class: 'counts sub indent' }, el('span', { class: `bar ${color}` }, bar(ratio)), el('span', { class: 'rest' }, ...rest));
// A link that opens the Learn window (at a view and a course, when given).
const learnLink = (text, view, courseId) => el('div', { class: 'link act', onclick: () => openPage('learn', view, courseId) }, text);
// An explainer's clips (/explain): nothing opens by itself, so the way to them is on this tab.
const clipsLink = explain => el('div', { class: 'link act indent', onclick: () => post({ type: 'open', page: 'learn/video', explain }) }, `Watch clips ${G.arrow}`);

function phasesBody(foot) {
  if (!hasPlan()) return empty('No plan yet', 'When Claude plans a task, its phases show here as it works through them.');
  const plan = state.plan;
  foot.nodes = [`${plan.done} of ${plan.total} done`];
  return [
    el('div', { class: 'heading' }, plan.title),
    ...plan.items.map(item => {
      if (item.status === 'done') return markRow(`[${G.check}]`, 'ok', item.name, { box: true, cls: 'dim' });
      if (item.status === 'in_progress') return markRow(`[${G.live}]`, 'acc strong', item.name, { box: true, cls: 'acc strong' });
      return markRow('[ ]', 'dim', item.name, { box: true });
    }),
  ];
}

function testsBody(foot) {
  const list = [...runs()].reverse();
  if (list.length === 0) return empty('No test runs yet', 'Test commands Claude runs show here as they go, with their counts.');
  // All the runs shown, together; failures first (in red), so a trim takes the least of it.
  const totals = state.totals;
  if (totals && Number(totals.tests) > 0) {
    const rest = `${totals.passed} passed ${G.middot} ${totals.tests} tests in ${totals.runs} run${Number(totals.runs) === 1 ? '' : 's'}`;
    foot.nodes = Number(totals.failed) > 0 ? [el('span', { class: 'bad' }, `${totals.failed} failed`), ` ${G.middot} ${rest}`] : [rest];
  }
  return list.map((run, i) => {
    const look = runLook(run);
    return el('div', { class: i ? 'group' : '' },
      markRow(look.glyph, look.color, run.label, { cls: `trim ${run.status === 'running' ? 'ink' : 'dim'}` }),
      counts(run.ratio, look.color, ` ${run.count}`, el('span', { class: 'ok' }, `  ${G.check}${run.passed}`), Number(run.failed) > 0 ? el('span', { class: 'bad' }, ` ${G.cross}${run.failed}`) : null));
  });
}

// The plan in one line at the top of the Learn tab, as the WPF panel has it (Add-PlanGlance): the
// phase at work (or the next, or all done) with its count and bar. A click opens Phases.
function planGlance() {
  if (!hasPlan()) return [];
  const plan = state.plan;
  const now = plan.items.find(item => item.status === 'in_progress');
  const next = plan.items.find(item => item.status === 'todo');
  let glyph = G.live;
  let color = 'acc';
  let name;
  if (now) name = now.name;
  else if (Number(plan.done) >= Number(plan.total)) [glyph, color, name] = [G.check, 'ok', 'All phases done'];
  else if (next) [color, name] = ['dim', `Next: ${next.name}`];
  else return [];
  const row = el('div', { class: 'row' }, el('span', { class: `cell ${color}` }, glyph), el('div', { class: 'text trim ink' }, name), el('span', { class: 'count dim' }, `${plan.done}/${plan.total}`));
  const glance = el('div', { class: 'glance', title: `${plan.title}: open Phases`, onclick: () => selectTab('phases') }, row, counts(Number(plan.done) / Math.max(1, Number(plan.total)), color));
  return [glance, el('div', { class: 'rule' })];
}

function learnBody() {
  const b = build();
  const c = course();
  if (!b && !c) return [...planGlance(), ...empty('No course yet', 'Courses Claude builds from free videos and docs, to read while it works.'), learnLink(`Open Learn ${G.arrow}`, '')];
  const parts = [...planGlance()];
  if (b) {
    const color = buildColor(b.state);
    const glyph = b.state === 'done' ? G.check : b.state === 'failed' ? G.cross : G.live;
    parts.push(markRow(glyph, color, b.topic, { cls: 'trim' }));
    parts.push(el('div', { class: 'sub indent dim' }, b.message));
    if (Number(b.total) > 0 && b.state !== 'done') parts.push(counts(Number(b.done) / Number(b.total), color, ` ${b.done}/${b.total} ${b.kind === 'explain' ? 'clips' : 'pages'}`));
    if (b.kind === 'explain' && /^x[0-9a-f]{12,20}$/.test(String(b.explain || ''))) parts.push(clipsLink(b.explain));
  }
  if (c) {
    parts.push(markRow(G.course, 'dim', c.title, { cls: 'strong', top: b ? 'group' : '' }));
    parts.push(el('div', { class: 'sub indent dim' }, `Page ${c.page} of ${c.total}${c.next ? ` ${G.middot} next: ${c.next}` : ''}`));
  }
  // The course this tab names, not whichever Learn had open last.
  const courseId = c && typeof c.id === 'string' ? c.id : '';
  const link = c ? learnLink(`Carry on reading ${G.arrow}`, 'course', courseId) : learnLink(`Open Learn ${G.arrow}`, '');
  link.classList.add('indent');
  parts.push(link);
  return parts;
}

// Newest first: "0.2.0 · 29 Oct · Mahmood", then its notes. The entries the person had not seen when
// they opened the tab wear the new mark (with nothing seen before, the newest alone).
function releasesBody(foot) {
  const list = releases.list;
  const parts = [];
  const newest = list[0]?.version;
  if (releases.version && newest && compareVersion(releases.version, newest) > 0) {
    parts.push(el('div', { class: 'bad trim' }, `v${releases.version} has no release note yet`));
  }
  if (list.length === 0) return [...parts, ...empty('No release notes', 'This copy of the plugin has no releases.json beside its mac folder.')];
  const shown = Math.min(list.length, RELEASES_SHOWN);
  for (let i = 0; i < shown; i++) {
    const release = list[i];
    const isNew = seenBefore ? compareVersion(release.version, seenBefore) > 0 : i === 0;
    const meta = `${release.date ? ` ${G.middot} ${formatDate(release.date)}` : ''}${release.by ? ` ${G.middot} ${release.by}` : ''}`;
    parts.push(markRow(isNew ? G.live : '', 'acc', [el('b', { class: 'ink' }, release.version), el('span', { class: 'dim' }, meta)], { cls: 'trim', top: parts.length ? 'group' : '' }));
    for (const note of (release.notes || []).slice(0, 3)) parts.push(el('div', { class: 'row sub indent' }, el('span', { class: 'cell dim' }, G.middot), el('div', { class: 'text' }, note)));
  }
  const noun = list.length === 1 ? 'release' : 'releases';
  foot.nodes = [shown < list.length ? `Newest ${shown} of ${list.length} ${noun}` : `${list.length} ${noun}`];
  return parts;
}

// The collapsed card's one line: a lead (bold, in its colour) and the rest (dim). `keep` when the
// rest is the count ("· 2/5"): it then follows the lead in a block of its own, which never trims.
function summary() {
  const lead = (text, color, rest = '', { plain = false, keep = false } = {}) => ({
    main: [el(plain ? 'span' : 'b', { class: color }, text), rest && !keep ? el('span', { class: 'dim' }, rest) : null],
    tail: keep ? rest : '',
  });
  if (tab === 'releases') {
    const first = releases.list[0]?.notes?.[0];
    return lead(releases.version ? `v${releases.version}` : 'Releases', 'ink', first ? ` ${G.middot} ${first}` : '');
  }
  if (tab === 'learn') {
    const b = build();
    if (b) return lead('Learn', buildColor(b.state), ` ${G.middot} ${b.message}`);
    if (course()) return lead('Learn', 'ink', ` ${G.middot} ${course().title}`);
    return lead('Learn', 'ink', ` ${G.middot} no course yet`);
  }
  if (tab === 'tests') {
    const run = runs().at(-1);
    if (!run) return lead('No test runs yet', 'dim', '', { plain: true });
    const look = runLook(run);
    return lead(`${look.glyph} ${run.count}`, look.color, ` ${run.label}`);
  }
  if (!hasPlan()) return lead('No plan yet', 'dim', '', { plain: true });
  const plan = state.plan;
  const now = plan.items.find(item => item.status === 'in_progress') || plan.items.find(item => item.status === 'todo');
  const count = ` ${G.middot} ${plan.done}/${plan.total}`;
  return now ? lead(now.name, 'acc', count, { keep: true }) : lead('All done', 'ok', count, { keep: true });
}

// --- The strips -----------------------------------------------------------------------------

// The preset in use, by the test the swatches ring it by; null for colours of the person's own.
function presetInUse() {
  if (!appearance) return null;
  return presets.find(preset => appearance.preset === preset.name && appearance.colors.bg === preset.bg.toUpperCase() && appearance.colors.accent === preset.accent.toUpperCase()) || null;
}

// "COLOUR SCHEME · EMBER": the one under the mouse, else the one in use, else Custom.
function showSchemeCaption() {
  const inUse = presetInUse();
  const name = hoveredPreset || (inUse ? inUse.label || inUse.name : 'Custom');
  $('scheme-caption').textContent = `Colour scheme ${G.middot} ${name}`;
}

// Built once (again only when the presets change), then updated in place: a bar being dragged is
// never replaced under the pointer.
let builtPresets = '';
function drawLookStrip() {
  if (!T) return;
  const now = appearance;
  const key = JSON.stringify(presets);
  if (key !== builtPresets) {
    builtPresets = key;
    hoveredPreset = '';
    $('swatches').replaceChildren(...presets.map(preset =>
      el('button', {
        class: 'ui-swatch', title: preset.label || preset.name, style: `background:${preset.bg}`,
        onclick: () => pickPreset(preset),
        onmouseenter: () => { hoveredPreset = preset.label || preset.name; showSchemeCaption(); },
        onmouseleave: () => { hoveredPreset = ''; showSchemeCaption(); },
      }, el('i', { style: `background:${preset.accent}` }), el('i', { style: `background:${preset.text}` }))));
  }
  const inUse = presetInUse();
  [...$('swatches').children].forEach((swatch, i) => swatch.classList.toggle('on', presets[i] === inUse));
  showSchemeCaption();
  // The custom link in bold while the colours are the person's own.
  const custom = $('custom');
  custom.textContent = inUse ? `Custom colours ${G.arrow}` : `Custom colours (in use) ${G.arrow}`;
  custom.classList.toggle('in-use', !inUse);
  if (!$('bars').childElementCount) {
    $('bars').replaceChildren(...SEE_THROUGH.map(([group, label]) => {
      const see = el('div', { class: 'see', 'data-key': group, title: group === 'panel' ? 'How see-through the panel is' : `How see-through the ${label} windows are` },
        el('div', { class: 'track' }), el('div', { class: 'fill' }), el('div', { class: 'knob' }));
      see.addEventListener('pointerdown', startDrag);
      return el('div', { class: 'bar-row' }, el('label', {}, label), see, el('output', {}));
    }));
  }
  if (dragging) return;
  for (const see of $('bars').querySelectorAll('.see')) showBar(see, now.opacity[see.dataset.key]);
}

function showBar(see, value) {
  see.querySelector('.fill').style.width = `${value * 100}%`;
  see.querySelector('.knob').style.left = `${value * 100}%`;
  see.parentElement.querySelector('output').textContent = `${Math.round(value * 100)}%`;
}

let builtGames = false;
function drawGamesStrip() {
  if (builtGames) return;
  builtGames = true;
  $('games-strip').replaceChildren(...SIBLINGS.map(([page, label], i) =>
    el('button', { class: `ui-chip${i === 0 ? ' first' : ''}`, title: `Open ${label}`, onclick: () => { setStrip(''); openPage(page); } }, label)));
}

// One strip at a time ('look', 'games', '' for none); its mark shows it's open.
function setStrip(name) {
  strip = name;
  draw();
}

// The panel wears an appearance: every role, and the halo while the card is clear enough to need it.
function wear(value) {
  if (!T) return;
  T.applyAppearance(value, 'panel');
  const root = document.documentElement;
  const opacity = Number(value?.opacity?.panel);
  const rgb = T.parseHex(value?.colors?.bg);
  if (!rgb || !Number.isFinite(opacity) || opacity >= HALO_BELOW) {
    root.classList.remove('halo');
    return;
  }
  const strength = Math.min(1, Math.max(HALO_LEAST, (HALO_BELOW - opacity) / (HALO_BELOW - HALO_FULL_AT)));
  root.style.setProperty('--halo', `rgba(${rgb.join(', ')}, ${Math.round(strength * 1000) / 1000})`);
  root.classList.add('halo');
}

// Only what changed goes to Swift, which lays it over the file: a change another window made in
// the last moment (⌘] in a game, Learn's settings) is kept.
function pickPreset(preset) {
  if (!T) return;
  const colors = { bg: preset.bg.toUpperCase(), accent: preset.accent.toUpperCase(), text: preset.text.toUpperCase() };
  appearance = { ...appearance, preset: preset.name, colors };
  wear(appearance);
  post({ type: 'appearance', value: { preset: preset.name, colors } });
  draw();
}

// A see-through bar: click or drag. The panel shows its own value as it moves; the file is written
// (by Swift) when it's let go, and the other windows follow.
function valueAt(see, x) {
  const box = see.getBoundingClientRect();
  const ratio = box.width > 0 ? (x - box.left) / box.width : 1;
  return Math.round(Math.max(MIN_OPACITY, Math.min(1, ratio)) * 100) / 100;
}
function moveDrag(value) {
  dragging.value = value;
  showBar(dragging.see, value);
  if (dragging.key === 'panel') wear({ ...appearance, opacity: { ...appearance.opacity, panel: value } });
}
function startDrag(event) {
  if (event.button !== 0 || !T) return;
  const see = event.currentTarget;
  see.setPointerCapture?.(event.pointerId);
  dragging = { key: see.dataset.key, see, value: appearance.opacity[see.dataset.key] };
  moveDrag(valueAt(see, event.clientX));
  const move = e => moveDrag(valueAt(see, e.clientX));
  const end = () => {
    see.removeEventListener('pointermove', move);
    see.removeEventListener('pointerup', end);
    see.removeEventListener('pointercancel', end);
    const { key, value } = dragging;
    dragging = null;
    // A change saved elsewhere while dragging is the base; this bar's value goes on top of it.
    const base = pending ? T.parseAppearance(pending) : appearance;
    pending = null;
    appearance = { ...base, opacity: { ...base.opacity, [key]: value } };
    wear(appearance);
    post({ type: 'appearance', value: { opacity: { [key]: value } } });
    draw();
  };
  see.addEventListener('pointermove', move);
  see.addEventListener('pointerup', end);
  see.addEventListener('pointercancel', end);
}

function openPage(page, view, courseId) {
  const message = { type: 'open', page };
  if (view) message.view = view;
  if (courseId) message.course = courseId;
  post(message);
}

// --- Drawing --------------------------------------------------------------------------------

// The pick for the next panel, given to Swift with what this panel has seen: {plan (the plan's
// title), focus (the newest run)}. Releases is a look, never reopened: it is never saved, and the
// pick before it stays.
function savePick() {
  if (!PICKABLE_TABS.includes(manualTab)) return;
  const seen = { plan: seenPlan, focus: seenFocus };
  const text = JSON.stringify([manualTab, seen]);
  if (text === savedPick) return;
  savedPick = text;
  post({ type: 'tab', value: manualTab, seen });
}

// A tab click: that tab stays in front until something new comes (see pickTab), and the next panel
// opens on it unless something new has come by then (savePick). Opening Releases marks its newest
// version seen.
function selectTab(name) {
  if (name === 'releases' && tab !== 'releases') {
    seenBefore = seenRelease;
    const newest = newestRelease();
    if (newest) {
      seenRelease = newest;
      post({ type: 'seen', version: newest });
    }
  }
  tab = manualTab = name;
  savePick();
  draw();
}

// The version (row 1), with the new mark while there are notes the person has not opened.
function drawVersion() {
  const release = $('releases-tab');
  release.className = `tab${tab === 'releases' ? ' on' : ''}`;
  release.replaceChildren(releases.version ? `v${releases.version}` : 'Releases', isReleaseUnseen() ? el('span', { class: 'new' }, ` ${G.live}`) : '');
  release.hidden = !releases.version && releases.list.length === 0;
}

// Full labels when they fit the row. Else the tabs not in front give up their counts one at a time
// (SHORTEN_ORDER: the live test count last) until they fit; the tab in front gives up its own last.
function drawTabs() {
  const { full, short } = labels();
  const order = SHORTEN_ORDER.filter(name => name !== tab);
  if (PICKABLE_TABS.includes(tab)) order.push(tab);
  const list = $('tablist');
  for (let step = 0; step <= order.length; step++) {
    const shortened = order.slice(0, step);
    list.replaceChildren(...PICKABLE_TABS.map(name =>
      el('button', { class: `tab${name === tab ? ' on' : ''}`, onclick: () => selectTab(name) }, shortened.includes(name) ? short[name] : full[name])));
    if (list.scrollWidth <= list.clientWidth + 0.5) break;
  }
}

function draw() {
  document.body.classList.toggle('collapsed', collapsed);
  const toggle = $('collapse');
  toggle.textContent = collapsed ? G.expand : G.collapse;
  toggle.title = collapsed ? 'Expand' : 'Collapse';
  if (collapsed) {
    const line = summary();
    $('title-main').replaceChildren(...line.main.filter(Boolean));
    $('title-tail').textContent = line.tail;
  } else {
    // The chat's title, as the WPF panel shows it; Progress for a chat without one.
    const title = state && typeof state.title === 'string' && state.title.trim() ? state.title.trim() : 'Progress';
    $('title-main').textContent = title;
    $('title').title = title === 'Progress' ? '' : title;
    $('title-tail').textContent = '';
  }
  $('look').classList.toggle('on', strip === 'look');
  $('games').classList.toggle('on', strip === 'games');
  $('look-strip').hidden = collapsed || strip !== 'look';
  $('games-strip').hidden = collapsed || strip !== 'games';
  if (!collapsed) {
    drawVersion();
    drawTabs();
    if (strip === 'look') drawLookStrip();
    if (strip === 'games') drawGamesStrip();
    const foot = { nodes: [] };
    const parts = tab === 'tests' ? testsBody(foot) : tab === 'learn' ? learnBody() : tab === 'releases' ? releasesBody(foot) : phasesBody(foot);
    $('body').replaceChildren(...parts.filter(Boolean));
    if (foot.nodes.length) $('foot').replaceChildren(...foot.nodes);
    else $('foot').textContent = '';
  }
  requestAnimationFrame(report);
}

// The content's own height (what scrolls included): the window fits it unless sized. And where the
// marks and the grip are, so Swift's drag strip and grip view sit exactly on them. The strip covers
// what lies between the open/closed mark and the first thing that takes a click on the right (the
// version, else the marks); collapsed, the whole bar's height, so all of it drags.
function report() {
  const card = $('card');
  const scroll = $('scroll');
  const shown = getComputedStyle(scroll).display !== 'none';
  const natural = Math.ceil(card.offsetHeight - (shown ? scroll.clientHeight - $('body').offsetHeight : 0));
  if (natural !== lastHeight) {
    lastHeight = natural;
    post({ type: 'height', height: natural });
  }
  const head = $('head').getBoundingClientRect();
  const lead = $('collapse').getBoundingClientRect();
  const marks = ['releases-tab', 'look', 'games', 'close'].map($).filter(mark => !mark.hidden && getComputedStyle(mark).display !== 'none');
  const firstMark = marks.length ? marks[0].getBoundingClientRect().left : window.innerWidth;
  const chrome = {
    type: 'chrome',
    header: Math.ceil(collapsed ? card.getBoundingClientRect().bottom : head.bottom),
    left: Math.ceil(lead.right),
    icons: Math.ceil(window.innerWidth - firstMark),
    grip: collapsed ? 0 : $('grip').offsetWidth,
  };
  const text = JSON.stringify(chrome);
  if (text !== lastChrome) {
    lastChrome = text;
    post(chrome);
  }
}

// --- What Swift calls -------------------------------------------------------------------------

window.render = next => {
  state = next;
  pickTab();
  draw();
};
// A strip belongs to the open card: closing the card closes it. So does Releases, a look for the
// open card: closed, the one line follows what is live, and no news is hidden behind it.
function closeLooks() {
  strip = '';
  if (manualTab === 'releases') {
    manualTab = null;
    if (state) pickTab();
  }
}
window.setCollapsed = value => {
  collapsed = !!value;
  if (collapsed) closeLooks();
  draw();
};
// The header's double-click (Swift's drag strip sees it): open or close, as the mark does.
window.toggleCollapsed = () => {
  collapsed = !collapsed;
  if (collapsed) closeLooks();
  post({ type: 'collapsed', value: collapsed });
  draw();
};
// Sized by the person with the corner grip, or taller than the terminal: fill the window and scroll.
window.setSized = value => { $('card').classList.toggle('sized', !!value); draw(); };
// appearance.json as saved (null when there is none: Ember). May carry the presets too.
window.setAppearance = value => {
  if (!T) return;
  if (value && Array.isArray(value.presets)) presets = T.parsePresets({ presets: value.presets });
  if (dragging) { pending = value; return; }
  appearance = T.parseAppearance(value);
  wear(appearance);
  draw();
};
window.setPresets = list => {
  if (!T) return;
  presets = T.parsePresets(Array.isArray(list) ? { presets: list } : list);
  if (strip === 'look') draw();
};
// {version (plugin.json), releases (releases.json, newest first), seen (the version last opened)}.
window.setReleases = value => {
  releases = { version: value?.version || null, list: Array.isArray(value?.releases) ? value.releases.filter(r => r && r.version) : [] };
  if (!releases.version && releases.list.length) releases.version = releases.list[0].version;
  if (typeof value?.seen === 'string' && value.seen) seenRelease = seenBefore = value.seen;
  draw();
};
// What the person left the last panel as, given once before the first state: {tab (one of the
// pickable tabs, or null), seen (what that panel had seen with it: {plan, focus}; null from an
// older save, which then has seen nothing), collapsed}. Swift already knows it is collapsed:
// nothing is posted.
window.setPrefs = value => {
  if (PICKABLE_TABS.includes(value?.tab) && !isSeeded) {
    tab = manualTab = value.tab;
    const seen = value.seen && typeof value.seen === 'object' ? value.seen : {};
    seenPlan = typeof seen.plan === 'string' && seen.plan ? seen.plan : null;
    seenFocus = typeof seen.focus === 'string' && seen.focus ? seen.focus : null;
    savedPick = JSON.stringify([manualTab, value.seen ? { plan: seenPlan, focus: seenFocus } : null]);
  }
  if (value?.collapsed) { collapsed = true; strip = ''; }
  draw();
};
window.selectTab = selectTab;
window.setStrip = setStrip;

$('close').addEventListener('click', () => post({ type: 'close' }));
$('look').addEventListener('click', () => setStrip(strip === 'look' ? '' : 'look'));
$('games').addEventListener('click', () => setStrip(strip === 'games' ? '' : 'games'));
$('collapse').addEventListener('click', () => window.toggleCollapsed());
$('releases-tab').addEventListener('click', () => selectTab('releases'));
$('custom').addEventListener('click', () => { setStrip(''); openPage('learn', 'settings'); });
wear(appearance);
draw();
post({ type: 'loaded' });
</script>
</body>
</html>
